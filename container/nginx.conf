server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Files on the mounted volume, listed and downloadable (read only).
  location /data/ {
    alias /data/;
    autoindex on;
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
