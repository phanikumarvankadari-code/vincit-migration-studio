# Run from the repository root: docker compose -f container/docker-compose.yml up --build
services:
  mapping-studio:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: migration-mapping-studio:local
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Your own files: sources, projects, output. Mounted read-only; change the left side to your folder.
      - ${MMS_DATA_DIR:-../test-data}:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
